name: Compilar

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  windows:
    name: Programa de Windows (.exe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Compilar ControlRemoto.exe
        working-directory: pc
        run: GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ControlRemoto.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: ControlRemoto-Windows
          path: pc/ControlRemoto.exe

  android:
    name: App de Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ControlRemoto.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ControlRemoto-Android
          path: android/ControlRemoto.apk
