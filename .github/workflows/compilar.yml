name: Compilar

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  windows:
    name: Programa de Windows (.exe)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Compilar ControlRemoto.exe
        working-directory: pc
        run: GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ControlRemoto.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: ControlRemoto-Windows
          path: pc/ControlRemoto.exe

  android:
    name: App de Android (.apk)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Revisar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ControlRemoto.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ControlRemoto-Android
          path: android/ControlRemoto.apk
